<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Portfolio Content</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
</head>
<body>

<div class="aurora">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
</div>

<!-- LOGIN SCREEN -->
<div id="loginScreen" class="login-wrap">
  <form id="loginForm" class="glass login-card">
    <div class="login-logo">mahidhar<span>.</span>dev <span class="login-tag">/admin</span></div>
    <h1>Sign in</h1>
    <p class="login-sub">Manage everything on the portfolio from here.</p>
    <label>Username
      <input type="text" id="loginUsername" autocomplete="username" required>
    </label>
    <label>Password
      <input type="password" id="loginPassword" autocomplete="current-password" required>
    </label>
    <button type="submit" class="btn btn-primary" id="loginBtn">Sign in</button>
    <p class="login-error" id="loginError"></p>
  </form>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="dashboard hidden">
  <aside class="sidebar glass">
    <div class="sidebar-logo">mahidhar<span>.</span>dev</div>
    <nav id="tabNav" class="tab-nav">
      <button class="tab-btn active" data-tab="profile">Profile</button>
      <button class="tab-btn" data-tab="education">Education</button>
      <button class="tab-btn" data-tab="skills">Skills</button>
      <button class="tab-btn" data-tab="experience">Experience</button>
      <button class="tab-btn" data-tab="projects">Projects</button>
      <button class="tab-btn" data-tab="certifications">Certifications</button>
      <button class="tab-btn" data-tab="achievements">Achievements</button>
      <button class="tab-btn" data-tab="insights">Insights</button>
    </nav>
    <button id="logoutBtn" class="btn btn-ghost logout-btn">Log out</button>
  </aside>

  <main class="content">
    <div id="toast" class="toast"></div>

    <section id="panel-profile" class="panel"></section>
    <section id="panel-education" class="panel hidden"></section>
    <section id="panel-skills" class="panel hidden"></section>
    <section id="panel-experience" class="panel hidden"></section>
    <section id="panel-projects" class="panel hidden"></section>
    <section id="panel-certifications" class="panel hidden"></section>
    <section id="panel-achievements" class="panel hidden"></section>
    <section id="panel-insights" class="panel hidden"></section>
  </main>
</div>

<script src="admin.js"></script>
</body>
</html>
